<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Rauf Browser</title>
  <desc id="d">Rauf Browser: Clean. Fast. Private. An Android browser with AI and an API Hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d17"/><stop offset="0.55" stop-color="#111632"/><stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
