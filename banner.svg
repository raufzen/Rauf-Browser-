    <radialGradient id="g1" cx="0.2" cy="0.1" r="0.7"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
