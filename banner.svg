    <circle cx="1010" cy="120" r="150" fill="#8b5cf6" opacity="0.10"><animate attributeName="r" values="150;175;150" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="330" r="110" fill="#22d3ee" opacity="0.08"><animate attributeName="r" values="110;130;110" dur="9s" repeatCount="indefinite"/></circle>

